<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pongpan Nerunchorn — Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Pongpan Nerunchorn (Boat) — Full-Stack Developer, .NET / Vue / Angular.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved/system theme before Angular boots to avoid a light flash.
    try {
      var t = localStorage.getItem('portfolio.theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
